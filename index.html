<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five City - أسئلة التفعيل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">Five City</h1>
            <p class="subtitle">اختبار التفعيل</p>
        </div>

        <div class="quiz-container">
            <div class="question-card" id="question-card">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                
                <div class="question-header">
                    <span class="question-number" id="question-number">1 / 8</span>
                </div>

                <div class="question-content">
                    <h2 id="question-text"></h2>
                </div>

                <div class="options-container" id="options-container"></div>

                <div class="button-group">
                    <button class="btn btn-prev" id="btn-prev" onclick="previousQuestion()" disabled>
                        السابق
                    </button>
                    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">
                        التالي
                    </button>
                </div>

                <div class="result-message" id="result-message"></div>
            </div>
        </div>

        <div class="result-container" id="result-container" style="display: none;">
            <div class="result-card">
                <h2 id="result-title"></h2>
                <p id="result-text"></p>
                <div class="score-display">
                    <span id="score"></span>
                </div>
                <button class="btn btn-restart" onclick="restartQuiz()">
                    إعادة الاختبار
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
